name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - production
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: npm install --legacy-peer-deps
      - run: npm ci --legacy-peer-deps && npm run build
      - name: Verify CV PDFs in the deployment
        run: |
          for lang in en pt es; do
            test -s "build/cv/cv-$lang.pdf"
            cmp "public/cv/cv-$lang.pdf" "build/cv/cv-$lang.pdf"
          done
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DWRESUME }}'
          channelId: live
          projectId: dwresume
